# yudao-cloud 本地开发基础设施
#
# 最小启动（MySQL + Redis + Nacos）：
#   docker compose -f docker-compose-local.yaml --env-file local.env up -d
#
# 含 RocketMQ：
#   docker compose -f docker-compose-local.yaml --env-file local.env --profile mq up -d
#
# 含 XXL-Job：
#   docker compose -f docker-compose-local.yaml --env-file local.env --profile job up -d
#
# 全部启动：
#   docker compose -f docker-compose-local.yaml --env-file local.env --profile mq --profile job up -d
#
# 停止：
#   docker compose -f docker-compose-local.yaml down
#
# 停止并清除数据卷：
#   docker compose -f docker-compose-local.yaml down -v
#
# 注意：主机端口使用了非标准端口以避免与本地服务冲突，
#       详见 local.env 中的端口说明。
#
# ==================== 访问地址与默认账号密码 ====================
#
# Nacos 控制台（3.x 控制台在独立端口 8080）：
#   URL:  http://127.0.0.1:18080/
#   账号: nacos / nacos（认证关闭时无需登录）
#
# XXL-Job 调度中心（3.x 端口 8080，上下文路径 /）：
#   URL:  http://127.0.0.1:19090/
#   账号: admin / 123456
#
# MySQL：
#   地址: 127.0.0.1:13306
#   账号: root / 123456
#
# Redis：
#   地址: 127.0.0.1:16379
#   密码: 无（本地开发未设置）

name: yudao-cloud-local

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0.33
    container_name: yudao-mysql
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-ruoyi-vue-pro.sql:ro
      - ../../../sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ../../../sql/mysql/nacos.sql:/docker-entrypoint-initdb.d/03-nacos.sql:ro
      - ../../../sql/mysql/xxl_job.sql:/docker-entrypoint-initdb.d/04-xxl_job.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ruoyi-vue-pro
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7.4-alpine
    container_name: yudao-redis
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== Nacos 注册中心 & 配置中心 ====================
  nacos:
    image: nacos/nacos-server:v3.2.2
    container_name: yudao-nacos
    ports:
      - "18848:8848"
      - "19848:9848"   # gRPC 端口（Nacos 2.x/3.x 客户端通信必需）
      - "18080:8080"   # Nacos 3.x 控制台端口
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8848' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== RocketMQ 消息队列（需要 --profile mq） ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: yudao-rocketmq-namesrv
    ports:
      - "19876:9876"
    command: sh mqnamesrv
    restart: unless-stopped
    profiles: ["mq"]

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: yudao-rocketmq-broker
    ports:
      - "20911:10911"  # remoting
      - "20909:10909"  # grpc proxy (RocketMQ 5.x)
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    depends_on:
      rocketmq-namesrv:
        condition: service_started
    restart: unless-stopped
    profiles: ["mq"]

  # ==================== XXL-Job 定时任务管理（需要 --profile job） ====================
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: yudao-xxl-job-admin
    ports:
      - "19090:8080"
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456}
        --xxl.job.accessToken=default_token
      JAVA_OPTS: -Xms512m -Xmx512m
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["job"]

volumes:
  mysql-data:
    name: yudao-cloud-mysql
  redis-data:
    name: yudao-cloud-redis